<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1.0">
<title>M3 Family Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2330;
    --border: #30363d;
    --accent: #e8a838;
    --accent2: #58a6ff;
    --accent3: #3fb950;
    --accent4: #f78166;
    --accent5: #bc8cff;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --text-dim: #484f58;
    --marc: #58a6ff;
    --mita: #f78166;
    --major: #3fb950;
    --family: #e8a838;
    --chore: #a78bfa;
    --maintain: #22d3ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 18px; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 32px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .logo span { color: var(--text-muted); font-weight: 400; font-size: 1rem; margin-left: 8px; }
  .datetime { text-align: center; }
  .clock {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .date-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
  .view-tabs { display: flex; gap: 6px; }
  .tab {
    padding: 8px 20px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
  .legend { display: flex; gap: 20px; align-items: center; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text-muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .main { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 16px 24px; }
  .nav-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; flex-shrink: 0;
  }
  .nav-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 6px 16px; border-radius: 6px;
    cursor: pointer; font-size: 1rem; transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; color: var(--text); }
  .view { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .view.active { display: flex; }
  #day-view { display: none; flex-direction: row; gap: 16px; }
  #day-view.active { display: flex; }
  .day-timeline {
    flex: 1; background: var(--surface); border-radius: 10px;
    border: 1px solid var(--border); overflow-y: auto; padding: 8px 0; min-width: 0;
  }
  .hour-row {
    display: flex; align-items: stretch; min-height: 52px;
    border-bottom: 1px solid var(--border); position: relative;
  }
  .hour-row:last-child { border-bottom: none; }
  .hour-label {
    width: 60px; padding: 6px 12px; font-size: 0.72rem;
    color: var(--text-dim); flex-shrink: 0; text-align: right; padding-top: 8px;
  }
  .hour-slots { flex: 1; padding: 4px 8px; display: flex; flex-direction: column; gap: 3px; }
  .day-event {
    border-radius: 5px; padding: 4px 10px; font-size: 0.82rem;
    font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  .day-event .event-time { font-size: 0.72rem; opacity: 0.8; }
  .day-sidebar { width: 50%; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px;
  }
  .sidebar-card h3 {
    font-size: 0.9rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 12px;
  }
  .upcoming-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 0;
    border-bottom: 1px solid var(--border); font-size: 1rem;
  }
  .upcoming-item:last-child { border-bottom: none; }
  .upcoming-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .upcoming-info { flex: 1; }
  .upcoming-name { color: var(--text); font-weight: 500; font-size: 1rem; }
  .upcoming-meta { font-size: 0.85rem; color: var(--text-muted); }
  .week-grid {
    flex: 1; display: grid; grid-template-columns: 48px repeat(7, 1fr);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface);
  }
  .week-header-cell {
    padding: 10px 6px; text-align: center; border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border); font-size: 0.8rem;
  }
  .week-header-cell .day-name { color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .week-header-cell .day-num {
    font-size: 1.2rem; font-weight: 600; margin-top: 2px; width: 32px; height: 32px;
    border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  }
  .week-header-cell.today .day-num { background: var(--accent); color: #000; }
  .week-time-col { border-right: 1px solid var(--border); }
  .week-hour-label {
    height: 44px; display: flex; align-items: flex-start; justify-content: flex-end;
    padding: 4px 8px 0 0; font-size: 0.65rem; color: var(--text-dim); border-bottom: 1px solid var(--border);
  }
  .week-cell {
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    height: 44px; padding: 2px 3px; position: relative; vertical-align: top;
  }
  .week-cell.today-col { background: rgba(232, 168, 56, 0.04); }
  .week-event {
    border-radius: 3px; padding: 2px 5px; font-size: 0.68rem; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px;
  }
  .month-grid {
    flex: 1; display: flex; flex-direction: column; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  }
  .month-header-row { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--border); }
  .month-day-header {
    padding: 10px 8px; text-align: center; font-size: 0.9rem; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-muted); border-right: 1px solid var(--border);
  }
  .month-day-header:last-child { border-right: none; }
  .month-weeks { flex: 1; display: flex; flex-direction: column; }
  .month-week-row {
    display: grid; grid-template-columns: repeat(7, 1fr);
    flex: 1; border-bottom: 1px solid var(--border);
  }
  .month-week-row:last-child { border-bottom: none; }
  .month-cell {
    border-right: 1px solid var(--border); padding: 6px 8px;
    display: flex; flex-direction: column; gap: 2px; overflow: hidden;
    cursor: pointer; transition: background 0.15s;
  }
  .month-cell:hover { background: var(--surface2); }
  .month-cell:last-child { border-right: none; }
  .month-cell.other-month .cell-num { color: var(--text-dim); }
  .month-cell.today { background: rgba(232, 168, 56, 0.06); }
  .cell-num { font-size: 1rem; color: var(--text-muted); margin-bottom: 3px; font-weight: 500; }
  .cell-event {
    border-radius: 3px; padding: 2px 6px; font-size: 0.8rem; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cell-more { font-size: 0.78rem; color: var(--text-muted); padding-left: 4px; }
  .three-month-grid { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .mini-month {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; display: flex; flex-direction: column; overflow: hidden;
  }
  .mini-month-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; color: var(--text); }
  .mini-month.current .mini-month-title { color: var(--accent); }
  .mini-header { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
  .mini-day-label { text-align: center; font-size: 0.62rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 0; }
  .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); flex: 1; gap: 1px; }
  .mini-cell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; border-radius: 4px; cursor: pointer; position: relative;
    transition: background 0.15s; flex-direction: column; gap: 1px;
  }
  .mini-cell:hover { background: var(--surface2); }
  .mini-cell.other-month { color: var(--text-dim); }
  .mini-cell.today { background: var(--accent); color: #000; font-weight: 700; }
  .mini-cell.has-events::after {
    content: ''; display: block; width: 4px; height: 4px; border-radius: 50%;
    background: var(--accent2); position: absolute; bottom: 2px;
  }
  .mini-cell.today.has-events::after { background: rgba(0,0,0,0.5); }
  .mini-events-preview { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; flex: 1; overflow: hidden; }
  .mini-event-item {
    display: flex; align-items: center; gap: 6px; padding: 3px 0;
    font-size: 0.7rem; border-bottom: 1px solid var(--border);
  }
  .mini-event-item:last-child { border-bottom: none; }
  .mini-event-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .color-marc    { background-color: var(--marc);   color: #000; }
  .color-mita    { background-color: var(--mita);   color: #000; }
  .color-major   { background-color: var(--major);  color: #000; }
  .color-family   { background-color: var(--family);  color: #000; }
  .color-chore    { background-color: var(--chore);   color: #000; }
  .color-maintain { background-color: var(--maintain); color: #000; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 28px; width: 480px; max-width: 90vw; animation: slideUp 0.2s ease;
  }
  @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
  .modal h2 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-bottom: 20px; }
  .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .form-row label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .form-row input, .form-row select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 9px 12px; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
  }
  .form-row input:focus, .form-row select:focus { outline: none; border-color: var(--accent); }
  .form-row select option { background: var(--surface); }
  .form-row-inline { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .btn-cancel {
    background: transparent; border: 1px solid var(--border); color: var(--text-muted);
    padding: 9px 20px; border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.88rem;
  }
  .btn-save {
    background: var(--accent); border: none; color: #000; padding: 9px 24px;
    border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 600;
  }
  .btn-delete {
    background: transparent; border: 1px solid var(--accent4); color: var(--accent4);
    padding: 9px 16px; border-radius: 6px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 0.88rem; margin-right: auto;
  }
  .add-btn {
    background: var(--accent); border: none; color: #000; padding: 8px 18px;
    border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem; font-weight: 600; transition: opacity 0.15s;
  }
  .add-btn:hover { opacity: 0.85; }
  /* Day list items */
  .day-list-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 16px; border-radius: 7px; margin-bottom: 8px;
    cursor: pointer; font-size: 1.1rem; font-weight: 500;
  }
  .day-list-left {
    min-width: 110px; font-size: 0.95rem; opacity: 0.85; padding-top: 2px;
  }
  .day-list-title { flex: 1; line-height: 1.5; }

  /* Week list items */
  .week-list-item {
    border-radius: 5px; padding: 7px 9px; margin-bottom: 5px;
    cursor: pointer; font-size: 0.95rem;
  }

  /* Three month event items */
  .three-event-item {
    border-radius: 4px; padding: 5px 9px; margin-bottom: 5px;
    font-size: 0.88rem; font-weight: 500; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .dash-col { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
  .dash-col-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .dash-col-name { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; }
  .dash-col-body { flex: 1; overflow-y: auto; padding: 8px; }
  .dash-event { border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; cursor: pointer; }
  .dash-event-title { font-size: 0.9rem; font-weight: 600; line-height: 1.3; }
  .dash-event-meta { font-size: 0.75rem; opacity: 0.8; margin-top: 2px; }
  .dash-date-sep { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-dim); padding: 8px 4px 4px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="M3 Calendar">
<meta name="theme-color" content="#e8a838">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='20' fill='%230d1117'/><text x='90' y='75' font-family='serif' font-size='60' font-weight='bold' fill='%23e8a838' text-anchor='middle'>M3</text><text x='90' y='130' font-family='serif' font-size='26' fill='%238b949e' text-anchor='middle'>Calendar</text></svg>">
</head>
<body>

<div class="topbar">
  <div class="logo">M3 Family <span>Calendar</span></div>
  <div id="weather-widget" style="display:flex;align-items:center;gap:16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 20px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div id="weather-icon" style="font-size:2rem;line-height:1;">⏳</div>
      <div style="display:flex;flex-direction:column;gap:2px;">
        <div style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--accent);">Today</div>
        <div style="display:flex;align-items:baseline;gap:6px;">
          <span id="weather-temp" style="font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;color:var(--text);">--°</span>
          <span id="weather-desc" style="font-size:0.78rem;color:var(--text-muted);">Loading...</span>
        </div>
        <div style="display:flex;gap:8px;">
          <span id="weather-hilo" style="font-size:0.72rem;color:var(--text-muted);">H:--° L:--°</span>
          <span id="weather-rain" style="font-size:0.72rem;color:var(--accent2);">💧 --%</span>
          <span id="weather-wind" style="font-size:0.72rem;color:var(--text-muted);">💨 --</span>
        </div>
      </div>
    </div>
    <div style="width:1px;height:48px;background:var(--border);"></div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div id="weather-icon-tmr" style="font-size:2rem;line-height:1;">⏳</div>
      <div style="display:flex;flex-direction:column;gap:2px;">
        <div style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Tomorrow</div>
        <div style="display:flex;align-items:baseline;gap:6px;">
          <span id="weather-temp-tmr" style="font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;color:var(--text);">--°</span>
          <span id="weather-desc-tmr" style="font-size:0.78rem;color:var(--text-muted);">--</span>
        </div>
        <div style="display:flex;gap:8px;">
          <span id="weather-hilo-tmr" style="font-size:0.72rem;color:var(--text-muted);">H:--° L:--°</span>
          <span id="weather-rain-tmr" style="font-size:0.72rem;color:var(--accent2);">💧 --%</span>
        </div>
      </div>
    </div>
    <div style="font-size:0.62rem;color:var(--text-dim);align-self:flex-end;" id="weather-updated"></div>
  </div>
  <div class="datetime">
    <div class="clock" id="clock">--:--</div>
    <div class="date-label" id="date-label">Loading...</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;">
    <div class="view-tabs">
      <button class="tab active" onclick="setView('day')">Day</button>
      <button class="tab" onclick="setView('week')">Week</button>
      <button class="tab" onclick="setView('month')">Month</button>
      <button class="tab" onclick="setView('three')">3 Month</button>
      <button class="tab" onclick="setView('dash')">Dashboard</button>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--marc)"></div> Marc</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--mita)"></div> Mita</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--major)"></div> Major</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--family)"></div> Family</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--chore)"></div> Chores</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--maintain)"></div> Home Maint.</div>
      </div>
      <button class="add-btn" onclick="openAddModal()">+ Add Event</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="nav-row">
    <button class="nav-btn" onclick="navPrev()">&#8592; Prev</button>
    <div class="nav-title" id="nav-title"></div>
    <button class="nav-btn" onclick="navNext()">Next &#8594;</button>
  </div>

  <div class="view active" id="day-view">
    <div class="day-timeline" id="day-timeline"></div>
    <div class="day-sidebar">
      <div class="sidebar-card" style="flex:0 0 auto;">
        <h3 id="quote-label">Daily Inspiration</h3>
        <div id="daily-quote" style="font-size:0.95rem;line-height:1.6;color:var(--text);font-style:italic;padding:4px 0;">“Loading...”</div>
        <div id="daily-quote-source" style="font-size:0.78rem;color:var(--text-muted);margin-top:6px;text-align:right;"></div>
      </div>
      <div class="sidebar-card">
        <h3>Upcoming Events</h3>
        <div id="upcoming-list"></div>
      </div>
    </div>
  </div>

  <div class="view" id="week-view">
    <div id="week-header-grid" style="display:none;"></div>
    <div id="week-body" style="display:none;"></div>
  </div>

  <div class="view" id="month-view">
    <div class="month-grid">
      <div class="month-header-row" id="month-header"></div>
      <div class="month-weeks" id="month-weeks"></div>
    </div>
  </div>

  <div class="view" id="three-view">
    <div class="three-month-grid" id="three-month-grid"></div>
  </div>
  <div class="view" id="dash-view">
    <div id="dash-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex:1;overflow:hidden;"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">Add Event</h2>
    <div class="form-row">
      <label>Event Title</label>
      <input type="text" id="input-title" placeholder="e.g. Soccer Practice">
    </div>
    <div class="form-row-inline">
      <div class="form-row" style="margin-bottom:0">
        <label>Date</label>
        <input type="date" id="input-date">
      </div>
      <div class="form-row" style="margin-bottom:0">

  {id:30001,title:"🏠 Maint: Test all smoke & CO detectors",date:"2025-01-15",who:"maintain",notes:"Replace batteries — do every January"},
  {id:30002,title:"🏠 Maint: Flush water heater sediment",date:"2025-01-20",who:"maintain",notes:"Attach hose to drain valve — extends life"},

  {id:30021,title:"🏠 Maint: Clean AC condenser coils outside",date:"2025-03-01",who:"maintain",notes:"Rinse with hose — improves efficiency"},
  {id:30022,title:"🏠 Maint: Check irrigation system & sprinkler heads",date:"2025-03-15",who:"maintain",notes:"Spring activation — check for broken heads"},

let currentView = 'day';
let currentDate = new Date();
let editingId = null;

// Load from localStorage, but seed if empty or only has old demo data
function initEvents() {
  const stored = localStorage.getItem('m3_events_v12');

// ===== CLOCK =====
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}`;
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('date-label').textContent =
    `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
}
setInterval(updateClock, 1000);

// ===== VIEW SWITCHING =====
function setView(v) {
  currentView = v;
  var viewOrder = ['day','week','month','three','dash'];
  document.querySelectorAll('.tab').forEach(function(t,i){ t.classList.toggle('active', viewOrder[i]===v); });
  document.querySelectorAll('.view').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById(v+'-view').classList.add('active');
  currentViewIndex = VIEWS.indexOf(v);
  if (currentViewIndex < 0) currentViewIndex = 0;
  renderView();
}

function navPrev() {
  if (currentView === 'day') currentDate.setDate(currentDate.getDate()-1);
  else if (currentView === 'week') currentDate.setDate(currentDate.getDate()-7);
  else if (currentView === 'month') currentDate.setMonth(currentDate.getMonth()-1);
  else if (currentView === 'three') currentDate.setMonth(currentDate.getMonth()-3);
  renderView();
}
function navNext() {
  if (currentView === 'day') currentDate.setDate(currentDate.getDate()+1);
  else if (currentView === 'week') currentDate.setDate(currentDate.getDate()+7);
  else if (currentView === 'month') currentDate.setMonth(currentDate.getMonth()+1);
  else if (currentView === 'three') currentDate.setMonth(currentDate.getMonth()+3);
  renderView();
}
function renderView() {
  var views = { day: renderDay, week: renderWeek, month: renderMonth, three: renderThree, dash: renderDash };
  views[currentView]();
}

// ===== HELPERS =====
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const toDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayStr = () => toDateStr(new Date());
const colorVar = (who) => `var(--${who})`;

function getEventsForDate(dateStr) {
  return events.filter(e => e.date === dateStr).sort((a,b) => (a.start||'00:00').localeCompare(b.start||'00:00'));
}

function formatTime(t) {
  if (!t) return '';
  const [h,m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hour = h % 12 || 12;
  return `${hour}:${String(m).padStart(2,'0')} ${ampm}`;
}

// ===== DAY VIEW =====
function renderDay() {
  const dateStr = toDateStr(currentDate);
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('nav-title').textContent =
    dayNames[currentDate.getDay()] + ', ' + MONTHS[currentDate.getMonth()] + ' ' + currentDate.getDate() + ', ' + currentDate.getFullYear();

  const dayEvents = getEventsForDate(dateStr);
  const timeline = document.getElementById('day-timeline');

  // Build event list — no hours, just items sorted by time
  let html = '';
  if (dayEvents.length === 0) {
    html = '<div style="padding:32px;text-align:center;color:var(--text-dim);font-size:1rem;">No events today</div>';
  } else {
    html = dayEvents.map(function(e) {
      var timeStr = e.start ? '<span class="event-time">' + formatTime(e.start) + (e.end ? ' – ' + formatTime(e.end) : '') + '</span>' : '';
      var noteStr = e.notes ? '<span style="font-size:0.72rem;opacity:0.7;margin-left:8px;">' + e.notes + '</span>' : '';
      return '<div class="day-list-item color-' + e.who + '" onclick="openEditModal(' + e.id + ')">'
        + '<div class="day-list-left">' + timeStr + '</div>'
        + '<div class="day-list-title">' + e.title + noteStr + '</div>'
        + '</div>';
    }).join('');
  }
  timeline.innerHTML = html;

  // Upcoming sidebar
  const upcoming = events.filter(function(e) { return e.date >= dateStr; })
    .sort(function(a,b) { return a.date.localeCompare(b.date) || (a.start||'').localeCompare(b.start||''); })
    .slice(0, 12);
  const ul = document.getElementById('upcoming-list');
  ul.innerHTML = upcoming.map(function(e) {
    return '<div class="upcoming-item" onclick="openEditModal(' + e.id + ')">'
      + '<div class="upcoming-dot" style="background:' + colorVar(e.who) + '"></div>'
      + '<div class="upcoming-info">'
      + '<div class="upcoming-name">' + e.title + '</div>'
      + '<div class="upcoming-meta">' + (e.date === dateStr ? 'Today' : e.date) + (e.start ? ' · ' + formatTime(e.start) : '') + '</div>'
      + '</div></div>';
  }).join('');
}

// ===== WEEK VIEW =====
function renderWeek() {
  // Start from today (currentDate) and show next 7 days
  var days = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(currentDate);
    d.setDate(currentDate.getDate() + i);
    days.push(d);
  }
  var weekStart = days[0];
  var today = todayStr();

  document.getElementById('nav-title').textContent =
    'Week of ' + MONTHS[weekStart.getMonth()] + ' ' + weekStart.getDate() + ' – ' + MONTHS[days[6].getMonth()] + ' ' + days[6].getDate() + ', ' + days[6].getFullYear();

  // Hide old header/body, use week-view div directly
  var headerGrid = document.getElementById('week-header-grid');
  headerGrid.style.cssText = 'display:none';
  var body = document.getElementById('week-body');
  body.style.cssText = 'display:none';

  // Build 7-column event list inside week-view
  var container = document.getElementById('week-list-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'week-list-container';
    document.getElementById('week-view').appendChild(container);
  }
  container.style.cssText = 'display:grid;grid-template-columns:repeat(7,1fr);gap:10px;flex:1;min-height:0;overflow:hidden;';

  container.innerHTML = days.map(function(d) {
    var ds = toDateStr(d);
    var isToday = ds === today;
    var dayEvents = getEventsForDate(ds);
    var evHtml = dayEvents.length === 0
      ? '<div style="font-size:0.7rem;color:var(--text-dim);padding:6px 4px;">No events</div>'
      : dayEvents.map(function(e) {
          var timeStr = e.start ? '<div style="font-size:0.68rem;opacity:0.75;">' + formatTime(e.start) + '</div>' : '';
          return '<div class="week-list-item color-' + e.who + '" onclick="openEditModal(' + e.id + ')">'
            + timeStr
            + '<div style="font-size:0.78rem;font-weight:500;line-height:1.3;">' + e.title + '</div>'
            + '</div>';
        }).join('');

    var numDisp = isToday
      ? '<span style="background:var(--accent);color:#000;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;">' + d.getDate() + '</span>'
      : '<span style="font-size:0.85rem;font-weight:600;color:var(--text-muted);">' + d.getDate() + '</span>';

    return '<div style="background:var(--surface);border:1px solid ' + (isToday ? 'var(--accent)' : 'var(--border)') + ';border-radius:10px;display:flex;flex-direction:column;overflow:hidden;height:100%;">'
      + '<div style="padding:10px 10px 6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;">'
      + numDisp
      + '<span style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:' + (isToday ? 'var(--accent)' : 'var(--text-muted)') + ';">' + DAYS_SHORT[d.getDay()] + '</span>'
      + '</div>'
      + '<div style="padding:6px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1;">' + evHtml + '</div>'
      + '</div>';
  }).join('');
}

// ===== MONTH VIEW =====
function renderMonth() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  document.getElementById('nav-title').textContent = `${MONTHS[month]} ${year}`;
  const today = todayStr();

  document.getElementById('month-header').innerHTML =
    DAYS_SHORT.map(d => `<div class="month-day-header">${d}</div>`).join('');

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0);
  const startDow = firstDay.getDay();
  const totalCells = Math.ceil((startDow + lastDay.getDate()) / 7) * 7;

  let weeks = '';
  let weekRow = '';
  for (let i = 0; i < totalCells; i++) {
    const cellDate = new Date(year, month, 1 - startDow + i);
    const ds = toDateStr(cellDate);
    const isCurrentMonth = cellDate.getMonth() === month;
    const isToday = ds === today;
    const dayEvents = getEventsForDate(ds);
    const maxShow = 3;
    const evHtml = dayEvents.slice(0,maxShow).map(e =>
      `<div class="cell-event color-${e.who}" onclick="openEditModal(${e.id})" title="${e.title}">${e.title}</div>`).join('');
    const moreHtml = dayEvents.length > maxShow ? `<div class="cell-more">+${dayEvents.length-maxShow} more</div>` : '';
    const numDisp = isToday
      ? `<span class="cell-num"><span style="background:var(--accent);color:#000;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:0.82rem;">${cellDate.getDate()}</span></span>`
      : `<div class="cell-num">${cellDate.getDate()}</div>`;
    weekRow += `<div class="month-cell${!isCurrentMonth?' other-month':''}${isToday?' today':''}" onclick="jumpToDay('${ds}')">${numDisp}${evHtml}${moreHtml}</div>`;
    if ((i+1)%7===0) {
      weeks += `<div class="month-week-row">${weekRow}</div>`;
      weekRow = '';
    }
  }
  document.getElementById('month-weeks').innerHTML = weeks;
}

function jumpToDay(dateStr) {
  currentDate = new Date(dateStr + 'T12:00:00');
  setView('day');
}

// ===== THREE MONTH VIEW =====
function renderThree() {
  // Show next 90 days starting from today, grouped by month, single scrollable column
  var today = todayStr();
  var endDate = new Date();
  endDate.setDate(endDate.getDate() + 90);
  var endStr = toDateStr(endDate);

  // Nav title
  var startMonth = MONTHS[new Date().getMonth()];
  var endMonth = MONTHS[endDate.getMonth()];
  var endYear = endDate.getFullYear();
  document.getElementById('nav-title').textContent = startMonth + ' – ' + endMonth + ' ' + endYear;

  // Get all events in window, sorted
  var upcoming = events.filter(function(e) {
    return e.date >= today && e.date <= endStr;
  }).sort(function(a,b) {
    return a.date.localeCompare(b.date) || (a.start||'').localeCompare(b.start||'');
  });

  // Group by month
  var byMonth = {}, monthOrder = [];
  upcoming.forEach(function(e) {
    var mk = e.date.slice(0,7); // YYYY-MM
    if (!byMonth[mk]) { byMonth[mk] = []; monthOrder.push(mk); }
    byMonth[mk].push(e);
  });
  monthOrder = monthOrder.filter(function(m,i,a){ return a.indexOf(m)===i; });

  // Build 3-column layout, one column per month
  var cols = monthOrder.slice(0,3).map(function(mk) {
    var parts = mk.split('-');
    var monthName = MONTHS[parseInt(parts[1])-1] + ' ' + parts[0];
    var isCurrent = mk === today.slice(0,7);

    // Group events within month by date
    var grouped = {}, datOrder = [];
    byMonth[mk].forEach(function(e) {
      if (!grouped[e.date]) { grouped[e.date] = []; datOrder.push(e.date); }
      grouped[e.date].push(e);
    });
    datOrder = datOrder.filter(function(d,i,a){ return a.indexOf(d)===i; });

    var bodyHtml = datOrder.map(function(ds) {
      var d = new Date(ds + 'T12:00:00');
      var isToday = ds === today;
      var dayLabel = (isToday ? 'Today' : DAYS_SHORT[d.getDay()]) + ' ' + parseInt(ds.slice(8));
      var evItems = grouped[ds].map(function(e) {
        var timeStr = e.start ? '<span style="font-size:0.65rem;opacity:0.75;margin-right:5px;">' + formatTime(e.start) + '</span>' : '';
        return '<div class="three-event-item color-' + e.who + '" onclick="openEditModal(' + e.id + ')" title="' + e.title + '">' + timeStr + e.title + '</div>';
      }).join('');
      return '<div style="margin-bottom:8px;">'
        + '<div style="font-size:0.68rem;font-weight:600;color:' + (isToday?'var(--accent)':'var(--text-muted)') + ';text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px;padding-bottom:3px;border-bottom:1px solid var(--border);">' + dayLabel + '</div>'
        + evItems + '</div>';
    }).join('');

    return '<div class="mini-month' + (isCurrent ? ' current' : '') + '">'
      + '<div class="mini-month-title">' + monthName + '</div>'
      + '<div style="flex:1;overflow-y:auto;">' + (bodyHtml || '<div style="font-size:0.8rem;color:var(--text-dim);">No events</div>') + '</div>'
      + '</div>';
  }).join('');

  // Wrap in 3-col grid
  document.getElementById('three-month-grid').style.cssText = 'display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1;overflow:hidden;';
  document.getElementById('three-month-grid').innerHTML = cols || '<div style="color:var(--text-dim);padding:32px;">No upcoming events in next 90 days</div>';
}

// ===== DASHBOARD VIEW =====
function renderDash() {
  var today = todayStr();
  var endDate = new Date();
  endDate.setDate(endDate.getDate() + 60);
  var endStr = toDateStr(endDate);

  document.getElementById('nav-title').textContent = 'Family Dashboard — Next 60 Days';

  // Who we show and their colors
  var cols = [
    { who: 'family', label: 'Family',  color: 'var(--family)' },
    { who: 'marc',   label: 'Marc',    color: 'var(--marc)'   },
    { who: 'mita',   label: 'Mita',    color: 'var(--mita)'   },
    { who: 'major',  label: 'Major',   color: 'var(--major)'  },
  ];

  // Filter: no chores, no maintenance, no birthdays, no dog meds
  var skipWho = ['chore','maintain'];
  var skipWords = ['birthday','dog meds','chores:','major:','maint:'];

  function isSkipped(e) {
    if (skipWho.indexOf(e.who) >= 0) return true;
    var tl = e.title.toLowerCase();
    for (var i=0;i<skipWords.length;i++) { if (tl.indexOf(skipWords[i]) >= 0) return true; }
    return false;
  }

  var upcoming = events.filter(function(e) {
    return e.date >= today && e.date <= endStr && !isSkipped(e);
  }).sort(function(a,b){ return a.date.localeCompare(b.date)||(a.start||'').localeCompare(b.start||''); });

  var grid = document.getElementById('dash-grid');
  grid.innerHTML = cols.map(function(col) {
    // Family col shows family events; individual cols show their events + family events
    var colEvents = upcoming.filter(function(e) {
      if (col.who === 'family') return e.who === 'family';
      return e.who === col.who || e.who === 'family';
    });

    // Group by date
    var grouped = {}, sortedDates = [];
    colEvents.forEach(function(e) {
      if (!grouped[e.date]) { grouped[e.date] = []; sortedDates.push(e.date); }
      grouped[e.date].push(e);
    });
    sortedDates = sortedDates.filter(function(d,i,a){ return a.indexOf(d)===i; }).sort();

    var bodyHtml = sortedDates.length === 0
      ? '<div style="padding:16px;text-align:center;color:var(--text-dim);font-size:0.85rem;">No events</div>'
      : sortedDates.map(function(ds) {
          var d = new Date(ds + 'T12:00:00');
          var isToday = ds === today;
          var dayLabel = isToday ? 'Today' : (DAYS_SHORT[d.getDay()] + ' ' + MONTHS[d.getMonth()].slice(0,3) + ' ' + d.getDate());
          var evItems = grouped[ds].map(function(e) {
            var timeStr = e.start ? formatTime(e.start) : '';
            return '<div class="dash-event color-' + e.who + '" onclick="openEditModal(' + e.id + ')">'
              + '<div class="dash-event-title">' + e.title + '</div>'
              + (timeStr ? '<div class="dash-event-meta">' + timeStr + (e.notes ? ' · ' + e.notes : '') + '</div>' : '')
              + '</div>';
          }).join('');
          return '<div class="dash-date-sep">' + dayLabel + '</div>' + evItems;
        }).join('');

    return '<div class="dash-col">'
      + '<div class="dash-col-header">'
      + '<div style="width:12px;height:12px;border-radius:50%;background:' + col.color + ';"></div>'
      + '<div class="dash-col-name" style="color:' + col.color + ';">' + col.label + '</div>'
      + '</div>'
      + '<div class="dash-col-body">' + bodyHtml + '</div>'
      + '</div>';
  }).join('');
}

// ===== MODAL =====
function openAddModal(dateStr) {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Add Event';
  document.getElementById('input-title').value = '';
  document.getElementById('input-date').value = dateStr || toDateStr(currentDate);
  document.getElementById('input-who').value = 'family';
  document.getElementById('input-start').value = '';
  document.getElementById('input-end').value = '';
  document.getElementById('input-notes').value = '';
  document.getElementById('modal-actions').innerHTML = `
    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    <button class="btn-save" onclick="saveEvent()">Save Event</button>`;
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('input-title').focus(), 100);
}

function openEditModal(id) {
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Edit Event';
  document.getElementById('input-title').value = ev.title;
  document.getElementById('input-date').value = ev.date;
  document.getElementById('input-who').value = ev.who;
  document.getElementById('input-start').value = ev.start || '';
  document.getElementById('input-end').value = ev.end || '';
  document.getElementById('input-notes').value = ev.notes || '';
  document.getElementById('modal-actions').innerHTML = `
    <button class="btn-delete" onclick="deleteEvent(${id})">Delete</button>
    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    <button class="btn-save" onclick="saveEvent()">Save Changes</button>`;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
}

function saveEvent() {
  const title = document.getElementById('input-title').value.trim();
  if (!title) { document.getElementById('input-title').focus(); return; }
  const ev = {
    title,
    date: document.getElementById('input-date').value,
    who: document.getElementById('input-who').value,
    start: document.getElementById('input-start').value,
    end: document.getElementById('input-end').value,
    notes: document.getElementById('input-notes').value.trim(),
  };
  if (editingId) {
    const idx = events.findIndex(e => e.id === editingId);
    events[idx] = { ...events[idx], ...ev };
  } else {
    ev.id = Date.now();
    events.push(ev);
  }
  saveEvents();
  closeModal();
  renderView();
}

function deleteEvent(id) {
  if (!confirm('Delete this event?')) return;
  events = events.filter(e => e.id !== id);
  saveEvents();
  closeModal();
  renderView();
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (document.getElementById('modal-overlay').classList.contains('open')) return;
  if (e.key === 'ArrowLeft') navPrev();
  if (e.key === 'ArrowRight') navNext();
  if (e.key === '1') setView('day');
  if (e.key === '2') setView('week');
  if (e.key === '3') setView('month');
  if (e.key === '4') setView('three');
});

renderView();

// ===== AUTO-ROTATE =====
var VIEWS = ['day', 'three', 'dash']; // auto-rotate: day, 3-month, dashboard
const ROTATE_INTERVAL = 30000;   // 30 seconds per view
const PAUSE_AFTER_INTERACTION = 120000; // 2 minutes pause on click/touch

let rotateTimer = null;
let pauseTimer = null;
let autoplayPaused = false;
let currentViewIndex = 0;

// Indicator UI
const indicator = document.createElement('div');
indicator.id = 'autoplay-indicator';
indicator.style.cssText = `
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px;
  background: rgba(13,17,23,0.85); border: 1px solid var(--border);
  border-radius: 20px; padding: 6px 14px; z-index: 200;
  font-family: 'DM Sans', sans-serif; font-size: 0.75rem; color: var(--text-muted);
  backdrop-filter: blur(6px); transition: opacity 0.4s;
`;
document.body.appendChild(indicator);

// Progress bar
const progressBar = document.createElement('div');
progressBar.style.cssText = `
  position: fixed; bottom: 0; left: 0; height: 3px;
  background: var(--accent); width: 0%; z-index: 201;
  transition: none;
`;
document.body.appendChild(progressBar);

let progressAnim = null;

function startProgress() {
  progressBar.style.transition = 'none';
  progressBar.style.width = '0%';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      progressBar.style.transition = `width ${ROTATE_INTERVAL}ms linear`;
      progressBar.style.width = '100%';
    });
  });
}

function stopProgress() {
  progressBar.style.transition = 'none';
  progressBar.style.width = '0%';
}

function updateIndicator() {
  const dots = VIEWS.map(function(v, i) {
    var color = i === currentViewIndex ? 'var(--accent)' : 'var(--border)';
    return '<span style="width:7px;height:7px;border-radius:50%;background:' + color + ';display:inline-block;"></span>';
  }).join('');
  indicator.innerHTML = autoplayPaused
    ? '<span>&#9208;</span>' + dots + '<span>Paused &mdash; resuming in <span id="resume-countdown"></span>s</span>'
    : '<span>&#9654;</span>' + dots + '<span>Auto-rotating</span>';
}

function rotateView() {
  currentViewIndex = (currentViewIndex + 1) % VIEWS.length;
  setView(VIEWS[currentViewIndex]);
  startProgress();
  updateIndicator();
}

function startAutoRotate() {
  if (rotateTimer) clearInterval(rotateTimer);
  rotateTimer = setInterval(rotateView, ROTATE_INTERVAL);
  startProgress();
  autoplayPaused = false;
  updateIndicator();
}

function pauseAutoRotate() {
  if (rotateTimer) { clearInterval(rotateTimer); rotateTimer = null; }
  stopProgress();
  autoplayPaused = true;

  // Clear any existing pause timer
  if (pauseTimer) clearInterval(pauseTimer);

  let remaining = Math.floor(PAUSE_AFTER_INTERACTION / 1000);
  updateIndicator();
  const countdown = document.getElementById('resume-countdown');
  if (countdown) countdown.textContent = remaining;

  pauseTimer = setInterval(() => {
    remaining--;
    const cd = document.getElementById('resume-countdown');
    if (cd) cd.textContent = remaining;
    if (remaining <= 0) {
      clearInterval(pauseTimer);
      pauseTimer = null;
      startAutoRotate();
    }
  }, 1000);
}

// Sync currentViewIndex when view is changed manually
const _origSetView = setView;
window.setView = function(v) {
  _origSetView(v);
  currentViewIndex = VIEWS.indexOf(v);
};

// Pause on any user interaction (click, touch, keypress)
['click','touchstart','keydown'].forEach(evt => {
  document.addEventListener(evt, (e) => {
    // Don't pause if it's just the auto-rotate itself triggering
    if (e.isTrusted) pauseAutoRotate();
  }, { passive: true });
});

// Sync view index on manual tab clicks
document.querySelectorAll('.tab').forEach((tab, i) => {
  tab.addEventListener('click', () => { currentViewIndex = i; });
});

function loadDailyQuote() {
  // Pick quote based on day of year so it changes daily but is consistent all day
  var now = new Date();
  var start = new Date(now.getFullYear(), 0, 0);
  var diff = now - start;
  var oneDay = 1000 * 60 * 60 * 24;
  var dayOfYear = Math.floor(diff / oneDay);
  var q = QUOTES[dayOfYear % QUOTES.length];

  // Try live API first (ZenQuotes)
  fetch('https://zenquotes.io/api/today')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data[0] && data[0].q) {
        document.getElementById('daily-quote').textContent = '“' + data[0].q + '”';
        document.getElementById('daily-quote-source').textContent = data[0].a ? '— ' + data[0].a : '';
      }
    })
    .catch(function() {
      // Fallback to pre-loaded quote
      document.getElementById('daily-quote').textContent = '“' + q.text + '”';
      document.getElementById('daily-quote-source').textContent = q.source;
    });

  // Always show pre-loaded immediately, API will update if available
  document.getElementById('daily-quote').textContent = '“' + q.text + '”';
  document.getElementById('daily-quote-source').textContent = q.source;
}

// ===== WEATHER =====
var WEATHER_LAT = 32.9482;
var WEATHER_LON = -96.7297;
var WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=' + WEATHER_LAT + '&longitude=' + WEATHER_LON +
  '&current=temperature_2m,weathercode,precipitation_probability,windspeed_10m' +
  '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode' +
  '&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FChicago&forecast_days=2';

function weatherCodeToEmoji(code) {
  if (code === 0) return { icon: '☀️', desc: 'Clear' };
  if (code === 1) return { icon: '🌤️', desc: 'Mostly Clear' };
  if (code === 2) return { icon: '⛅', desc: 'Partly Cloudy' };
  if (code === 3) return { icon: '☁️', desc: 'Overcast' };
  if (code >= 45 && code <= 48) return { icon: '🌫️', desc: 'Foggy' };
  if (code >= 51 && code <= 55) return { icon: '🌦️', desc: 'Drizzle' };
  if (code >= 61 && code <= 65) return { icon: '🌧️', desc: 'Rain' };
  if (code >= 71 && code <= 77) return { icon: '❄️', desc: 'Snow' };
  if (code >= 80 && code <= 82) return { icon: '🌦️', desc: 'Showers' };
  if (code >= 95 && code <= 99) return { icon: '⛈️', desc: 'Thunderstorm' };
  return { icon: '🌡️', desc: 'Unknown' };
}

function fetchWeather() {
  fetch(WEATHER_URL)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var cur = data.current;
      var daily = data.daily;
      var wx = weatherCodeToEmoji(cur.weathercode);
      var temp = Math.round(cur.temperature_2m);
      var hi = Math.round(daily.temperature_2m_max[0]);
      var lo = Math.round(daily.temperature_2m_min[0]);
      var rain = cur.precipitation_probability;
      var wind = Math.round(cur.windspeed_10m);

      document.getElementById('weather-icon').textContent = wx.icon;
      document.getElementById('weather-temp').textContent = temp + '°F';
      document.getElementById('weather-desc').textContent = wx.desc;
      document.getElementById('weather-hilo').textContent = 'H:' + hi + '° L:' + lo + '°';
      document.getElementById('weather-rain').textContent = '💧 ' + rain + '%';
      document.getElementById('weather-wind').textContent = '💨 ' + wind + 'mph';
      // Tomorrow
      var wxT = weatherCodeToEmoji(daily.weathercode ? daily.weathercode[1] : 3);
      var hiT = Math.round(daily.temperature_2m_max[1] || 0);
      var loT = Math.round(daily.temperature_2m_min[1] || 0);
      var rainT = daily.precipitation_probability_max ? daily.precipitation_probability_max[1] : 0;
      document.getElementById('weather-icon-tmr').textContent = wxT.icon;
      document.getElementById('weather-temp-tmr').textContent = Math.round((hiT+loT)/2) + '°F';
      document.getElementById('weather-desc-tmr').textContent = wxT.desc;
      document.getElementById('weather-hilo-tmr').textContent = 'H:' + hiT + '° L:' + loT + '°';
      document.getElementById('weather-rain-tmr').textContent = '💧 ' + rainT + '%';
      var now = new Date(); var hh = now.getHours(); var mm = String(now.getMinutes()).padStart(2,'0');
      document.getElementById('weather-updated').textContent = 'Updated ' + (hh%12||12) + ':' + mm + (hh>=12?'pm':'am');
    })
    .catch(function() {
      document.getElementById('weather-desc').textContent = 'Unavailable';
    });
}

// Fetch on load, then every 15 minutes
fetchWeather();
setInterval(fetchWeather, 15 * 60 * 1000);
